name: Encryption check
on:
  push:
    branches: [pyoid/encryption-checks]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-01
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check code
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          cargo fmt --check
          cargo clippy --locked --workspace --all-features
          cargo test --locked --workspace
      - name: Build loader
        run: cargo build --locked -p gdpatch-loader --release
      - name: Check packs in Godot
        run: python3 .github/encryption-check/run.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: encryption-check-${{ matrix.os }}
          path: .encryption-check/*.log
